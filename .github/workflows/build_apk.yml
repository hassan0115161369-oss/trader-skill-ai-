name: Build Trader Skill AI APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-py311-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-${{ runner.os }}-py311-
            buildozer-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev \
            cmake libltdl-dev clang lld

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip wheel setuptools
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Build Android APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trader-skill-ai-apk
          path: bin/*.apk
          if-no-files-found: error
